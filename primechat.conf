<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost
    ServerAlias primechat.me www.primechat.com

    # DocumentRoot = public/ folder ONLY
    DocumentRoot /var/www/html/primechat/public

    # Allow .htaccess rewrites inside public/
    <Directory /var/www/html/primechat/public>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/primechat_error.log
    CustomLog ${APACHE_LOG_DIR}/primechat_access.log combined
</VirtualHost>
