<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="description" content="PrimeChat">
    <title>PrimeChat</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .splash-logo {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(0.95); }
        }
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-bg-primary flex flex-col items-center justify-center min-h-[100dvh] overflow-hidden m-0">

    <div id="splashContainer" class="flex flex-col items-center transition-opacity duration-500">
        <!-- V3 Minimalist Icon -->
        <div class="w-20 h-20 rounded-2xl flex items-center justify-center bg-bg-tertiary border border-border text-accent splash-logo shadow-lg">
            <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </div>
        <h1 class="mt-6 text-2xl font-bold tracking-tight text-primary font-heading">PrimeChat</h1>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const container = document.getElementById('splashContainer');
                container.classList.add('fade-out');
                
                setTimeout(() => {
                    const token = localStorage.getItem('token');
                    if (token) {
                        window.location.href = '/chat';
                    } else {
                        window.location.href = '/onboarding';
                    }
                }, 500); // Wait for fade out
            }, 1200); // Show splash for 1.2s
        });
    </script>
</body>
</html>
