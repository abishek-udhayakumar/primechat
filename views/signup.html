<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="description" content="Create your PrimeChat account — Premium real-time messaging">
    <title>Sign Up — PrimeChat</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <main class="auth-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <span class="auth-logo-text">PrimeChat</span>
            </div>

            <h1 class="auth-title">Create account</h1>
            <p class="auth-subtitle">Start chatting in seconds</p>

            <!-- Error Banner -->
            <div id="authError" class="auth-error-banner"></div>

            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-floating">
                    <input type="text" id="display_name" name="display_name" class="form-input" placeholder=" " autocomplete="name" required>
                    <label class="form-label" for="display_name">Full Name</label>
                    <div class="inline-error" id="display_nameError"></div>
                </div>

                <div class="form-floating">
                    <input type="text" id="username" name="username" class="form-input" placeholder=" " autocomplete="username" required minlength="3" maxlength="50">
                    <label class="form-label" for="username">Username</label>
                    <div class="inline-error" id="usernameError"></div>
                </div>

                <div class="form-floating">
                    <input type="email" id="email" name="email" class="form-input" placeholder=" " autocomplete="email" required>
                    <label class="form-label" for="email">Email</label>
                    <div class="inline-error" id="emailError"></div>
                </div>

                <div class="form-floating">
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder=" " autocomplete="tel">
                    <label class="form-label" for="phone">Phone <span style="opacity:0.5;font-weight:400;text-transform:none;">(optional)</span></label>
                    <div class="inline-error" id="phoneError"></div>
                </div>

                <div class="form-floating">
                    <input type="password" id="password" name="password" class="form-input" placeholder=" " autocomplete="new-password" required minlength="6">
                    <label class="form-label" for="password">Password</label>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <div class="inline-error" id="passwordError"></div>
                </div>

                <button type="submit" class="auth-submit" id="signupBtn">
                    <span class="auth-btn-text" id="signupBtnText">Create Account</span>
                    <span class="auth-btn-loading" id="signupBtnLoading">
                        <span class="auth-spinner"></span>
                        Creating account…
                    </span>
                </button>
            </form>

            <div class="auth-link-row">
                Already have an account? <a href="/login" class="auth-link">Sign in</a>
            </div>
        </div>
    </main>

    <script src="/js/utils.js" defer></script>
    <script src="/js/auth.js" defer></script>
</body>
</html>
