<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <title>PrimeChat</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/messages.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/profile.css">
    

</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <div class="chat-app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <div class="sidebar-header-left" id="sidebarProfileTrigger" style="cursor: pointer;">
                    <div class="avatar avatar--md" id="currentUserAvatar"></div>
                    <div class="sidebar-user-name" id="currentUserName">Loading...</div>
                </div>
                <div class="sidebar-header-actions">
                    <button class="btn btn--icon btn--ghost" id="newChatBtn" title="New Chat">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <button class="btn btn--icon btn--ghost" id="themeToggleBtn" title="Toggle Theme">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                </div>
            </header>

            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search users by name or phone...">
                    <div class="search-clear" id="searchClear">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                </div>
            </div>

            <!-- Conversation List -->
            <div class="conversation-list" id="conversationList">
                <!-- Populated by JS -->
                <div style="padding: 20px; text-align: center;">
                    <div class="spinner spinner--md" style="margin: 0 auto; display: inline-block;"></div>
                </div>
            </div>

            <!-- Search Results Overlay -->
            <div class="search-results" id="searchResults">
                <!-- Populated by JS -->
            </div>

            <!-- Profile Panel Overlay -->
            <div class="profile-panel" id="profilePanel">
                <header class="profile-panel-header">
                    <button class="btn btn--icon btn--ghost" id="closeProfileBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <h3>Profile Settings</h3>
                </header>
                <div class="profile-panel-body">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar-wrapper" id="profileAvatarWrapper">
                            <div class="avatar avatar--xl" id="profileAvatar"></div>
                            <div class="profile-avatar-overlay">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            </div>
                            <input type="file" id="avatarInput" class="hidden" accept="image/*">
                        </div>
                    </div>
                    
                    <div class="profile-field" id="profileDisplayNameField">
                        <div class="profile-field-label">Display Name</div>
                        <div class="profile-field-content">
                            <div class="profile-field-value" id="profileDisplayName"></div>
                            <button class="btn btn--icon btn--ghost edit-field-btn" data-target="DisplayName" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="profile-field" id="profileAboutField">
                        <div class="profile-field-label">About</div>
                        <div class="profile-field-content">
                            <div class="profile-field-value" id="profileAbout"></div>
                            <button class="btn btn--icon btn--ghost edit-field-btn" data-target="About" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="profile-field">
                        <div class="profile-field-label">Theme</div>
                        <div style="margin-top: 8px;">
                            <div class="theme-toggle" id="profileThemeToggle"></div>
                        </div>
                    </div>

                    <div class="profile-field">
                        <div class="profile-field-label">Chat Wallpaper</div>
                        <div class="wallpaper-grid">
                            <div class="wallpaper-option wallpaper-default active" data-bg="default"></div>
                            <div class="wallpaper-option" style="background: #1e1e2a" data-bg="solid1"></div>
                            <div class="wallpaper-option" style="background: linear-gradient(135deg, #1e1e2a, #2d2d3f)" data-bg="gradient1"></div>
                        </div>
                    </div>

                    <button class="btn btn--secondary btn--full" style="margin-top: 24px; color: var(--color-danger);" id="logoutBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; margin-right: 8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Log Out
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main" id="chatMain">
            <!-- Empty State -->
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <h2>Welcome to PrimeChat</h2>
                <p>Select a conversation from the sidebar or search for a user to start messaging.</p>
            </div>

            <!-- Active Chat View (Hidden by default) -->
            <div id="activeChatView" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <header class="chat-header" id="chatHeader" style="cursor: pointer;">
                    <div class="chat-header-left">
                        <button class="btn btn--icon btn--ghost chat-header-back" id="backToSidebarBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        </button>
                        <div class="avatar avatar--md" id="chatHeaderAvatar"></div>
                        <div class="chat-header-info">
                            <div class="chat-header-name" id="chatHeaderName">User Name</div>
                            <div class="chat-header-status" id="chatHeaderStatus">offline</div>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="btn btn--icon btn--ghost" title="Search">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                        <button class="btn btn--icon btn--ghost" id="chatInfoBtn" title="Contact Info">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        </button>
                    </div>
                </header>

                <div class="messages-container" id="messagesContainer">
                    <!-- Populated by JS -->
                </div>

                <div class="scroll-bottom-btn" id="scrollBottomBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    <div class="badge hidden" id="scrollBottomBadge"></div>
                </div>

                <div class="reply-preview" id="replyPreview">
                    <div class="reply-preview-content">
                        <div class="reply-preview-name" id="replyPreviewName"></div>
                        <div class="reply-preview-text" id="replyPreviewText"></div>
                    </div>
                    <button class="btn btn--icon btn--ghost" id="cancelReplyBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <div class="chat-input-area">
                    <div class="input-actions-left">
                        <button class="btn btn--icon btn--ghost" id="emojiBtn" title="Emojis">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                        </button>
                        <button class="btn btn--icon btn--ghost" id="attachBtn" title="Attach">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <input type="file" id="fileInput" class="hidden">
                    </div>

                    <div class="chat-input-wrapper" id="chatInputWrapper">
                        <textarea class="chat-input" id="messageInput" placeholder="Type a message" rows="1"></textarea>
                    </div>

                    <div class="voice-recording-bar" id="voiceRecordingBar">
                        <div class="voice-recording-indicator"></div>
                        <div class="voice-recording-time" id="voiceRecordingTime">00:00</div>
                        <div style="flex: 1;"></div>
                        <div class="voice-recording-cancel" id="voiceRecordingCancel">Cancel</div>
                    </div>

                    <div class="input-actions-right">
                        <button class="send-btn hidden" id="sendBtn" title="Send">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                        <button class="btn btn--icon btn--ghost voice-btn" id="voiceBtn" title="Record Voice">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- User Info Panel -->
        <aside class="user-info-panel" id="userInfoPanel">
            <header class="chat-header">
                <div class="chat-header-left">
                    <button class="btn btn--icon btn--ghost" id="closeUserInfoBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                    <div class="chat-header-name">Contact Info</div>
                </div>
            </header>
            <div class="user-info-content">
                <div class="avatar avatar--xl" id="infoAvatar"></div>
                <div style="text-align: center;">
                    <h3 style="font-size: var(--fs-xl); margin-bottom: 4px;" id="infoName"></h3>
                    <div style="color: var(--color-text-secondary); font-size: var(--fs-sm);" id="infoUsername"></div>
                </div>
                <div style="width: 100%; margin-top: 16px;">
                    <div class="profile-field-label">About</div>
                    <div style="font-size: var(--fs-base);" id="infoAbout"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modals & Overlays -->
    <div class="emoji-picker" id="emojiPicker">
        <!-- Rendered by JS -->
    </div>

    <div class="image-viewer" id="imageViewer">
        <div class="image-viewer-close" id="closeImageViewer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
        <img src="" id="viewerImage" alt="Enlarged view">
    </div>

    <div class="file-drop-overlay" id="fileDropOverlay">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        <span>Drop file to send</span>
    </div>

    <!-- Context Menu -->
    <div class="message-context-menu hidden" id="messageContextMenu">
        <div class="context-menu-item" id="menuReply">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
            Reply
        </div>
        <div class="context-menu-item" id="menuForward">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 17 20 12 15 7"></polyline><path d="M4 18v-2a4 4 0 0 1 4-4h12"></path></svg>
            Forward
        </div>
        <div class="context-menu-item" id="menuEdit" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Edit
        </div>
        <div class="dropdown-separator"></div>
        <div class="context-menu-item context-menu-item--danger" id="menuDeleteMe">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            Delete for me
        </div>
        <div class="context-menu-item context-menu-item--danger" id="menuDeleteEveryone" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Delete for everyone
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/messages.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/upload.js"></script>
    <script src="/js/emoji.js"></script>
    <script src="/js/voice.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
