    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
    <div class="flex items-center justify-center min-h-[100dvh] p-4 relative overflow-hidden bg-bg-primary">
        <!-- Auth Card -->
        <div class="auth-card" id="authCard">
            <!-- Header Brand Details -->
            <div class="flex flex-col items-center mb-8">
                <!-- V3 Minimalist Icon -->
                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4 bg-bg-tertiary border border-border text-accent">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-primary">Sign in to PrimeChat</h1>
                <p class="text-xs text-secondary mt-1 font-medium">Calm, clear, and secure messaging</p>
            </div>

            <!-- Global Error Alerts -->
            <div class="auth-error-banner" id="authError"></div>

            <!-- Form -->
            <form id="loginForm" class="flex flex-col gap-3.5" novalidate>
                <!-- Email or Username Input -->
                <div class="form-floating">
                    <input type="text" id="identifier" class="form-input peer" placeholder=" " autocomplete="username" required>
                    <label for="identifier" class="form-label">Email or Username</label>
                    <div class="inline-error" id="identifierError"></div>
                </div>

                <!-- Password Input -->
                <div class="form-floating">
                    <input type="password" id="password" class="form-input peer" placeholder=" " autocomplete="current-password" required>
                    <label for="password" class="form-label">Password</label>
                    
                    <button type="button" class="absolute right-3.5 top-6 -translate-y-1/2 text-tertiary hover:text-primary transition-colors p-1" id="togglePw" aria-label="Toggle password visibility">
                        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <div class="inline-error" id="passwordError"></div>
                </div>

                <!-- Action Submit Button -->
                <button type="submit" class="auth-submit" id="loginBtn">
                    <span class="auth-btn-text" id="loginBtnText">Sign In</span>
                    <span class="auth-btn-loading hidden items-center gap-2" id="loginBtnLoading">
                        <span class="spinner spinner--sm border-white/45 border-t-white"></span>
                        Connecting…
                    </span>
                    <span class="auth-btn-success hidden items-center justify-center gap-2">
                        <svg class="w-[20px] h-[20px] animate-check-pop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                </button>
            </form>

            <!-- Navigate to Signup -->
            <p class="text-xs text-secondary text-center mt-6 font-medium">
                Don't have an account?
                <a href="/signup" class="text-accent font-semibold hover:underline transition-colors">Create one</a>
            </p>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
