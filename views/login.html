<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to PrimeChat — Premium real-time messaging">
    <title>Sign In — PrimeChat</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <div id="toastContainer" class="toast-container"></div>
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <span class="auth-logo-text">PrimeChat</span>
            </div>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to continue messaging</p>

            <!-- Error Banner -->
            <div id="authError" class="auth-error-banner"></div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="identifier">Email or Username</label>
                    <input type="text" id="identifier" name="identifier" class="form-input"
                           placeholder="you@example.com" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="••••••••" autocomplete="current-password" required minlength="6">
                </div>

                <button type="submit" class="auth-submit" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <div class="spinner spinner--sm hidden" id="loginSpinner"></div>
                </button>
            </form>

            <div class="auth-link-row">
                Don't have an account? <a href="/signup" class="auth-link">Create one</a>
            </div>
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
