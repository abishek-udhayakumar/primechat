<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="description" content="Sign in to PrimeChat — Premium real-time messaging">
    <title>Sign In — PrimeChat</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <main class="auth-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <span class="auth-logo-text">PrimeChat</span>
            </div>

            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to continue messaging</p>

            <!-- Error Banner -->
            <div id="authError" class="auth-error-banner"></div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-floating">
                    <input type="text" id="identifier" name="identifier" class="form-input" placeholder=" " autocomplete="username" required>
                    <label class="form-label" for="identifier">Email or Username</label>
                    <div class="inline-error" id="identifierError"></div>
                </div>

                <div class="form-floating">
                    <input type="password" id="password" name="password" class="form-input" placeholder=" " autocomplete="current-password" required minlength="6">
                    <label class="form-label" for="password">Password</label>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <div class="inline-error" id="passwordError"></div>
                </div>

                <button type="submit" class="auth-submit" id="loginBtn">
                    <span class="auth-btn-text" id="loginBtnText">Sign In</span>
                    <span class="auth-btn-loading" id="loginBtnLoading">
                        <span class="auth-spinner"></span>
                        Signing in…
                    </span>
                </button>
            </form>

            <div class="auth-link-row">
                Don't have an account? <a href="/signup" class="auth-link">Create one</a>
            </div>
        </div>
    </main>

    <script src="/js/utils.js" defer></script>
    <script src="/js/auth.js" defer></script>
</body>
</html>
